<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>订单查询</title>
</head>
<body>
  <h1>订单查询</h1>
  <form>
    <input id="keyword" name="keyword" placeholder="订单号">
    <select id="status" name="status">
      <option value="">全部</option>
      <option value="open">进行中</option>
      <option value="closed">已关闭</option>
    </select>
    <button id="search" type="button">查询</button>
    <button id="submit" type="button">提交</button>
  </form>

  <table id="orders">
    <thead>
      <tr><th>订单号</th><th>客户</th><th>金额</th></tr>
    </thead>
    <tbody>
      <tr><td>A001</td><td>甲公司</td><td>1200</td></tr>
      <tr><td>A002</td><td>乙公司</td><td>800</td></tr>
    </tbody>
  </table>
</body>
</html>
